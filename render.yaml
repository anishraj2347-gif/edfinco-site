# Render Blueprint for the EdFinco website (spec: https://render.com/docs/blueprint-spec).
# It creates the Next.js web service (from edfinco-site/) and its Postgres database, both in
# Singapore, the Render region closest to India.
#
# Plans: both start on Render's free plan. Upgrade them in the Render dashboard before
# www.edfinco.com points here: a free web service sleeps after 15 minutes without visitors (the
# next visit then waits about a minute) and Render deletes a free database 30 days after it is
# created unless it is upgraded.
#
# This repository is public, so no secret is ever written in this file. Add the remaining
# settings in the dashboard (web service > Environment); the list and what each one does is in
# edfinco-site/docs/production-checklist.md, section 2.
services:
  - type: web
    name: edfinco-site
    runtime: node
    region: singapore
    plan: free
    rootDir: edfinco-site
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: edfinco-db
          property: connectionString
      # The main admin's email address; asked for when the Blueprint is first applied.
      - key: MAIN_ADMIN_EMAILS
        sync: false
      # Shared secret for the hourly blog scheduler. Copy it into the GitHub Actions secret
      # CRON_SECRET (see .github/workflows/blog-scheduler.yml).
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: edfinco-db
    region: singapore
    plan: free
    databaseName: edfinco
    user: edfinco
    # Only services inside this Render account can connect; nothing on the internet can.
    ipAllowList: []
